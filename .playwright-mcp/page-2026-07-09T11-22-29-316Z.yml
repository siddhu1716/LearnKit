  - generic [ref=e623]:
    - generic [ref=e624]: 07 — Frequently asked
    - heading "Questions, answered." [level=2] [ref=e627]:
      - text: Questions,
      - text: answered.
    - generic [ref=e628]:
      - generic [ref=e629]:
        - button "What exactly does LearnKit store?" [ref=e630]:
          - generic [ref=e631]: What exactly does LearnKit store?
          - img [ref=e633]
        - paragraph [ref=e638]:
          - text: "LearnKit stores three types of records:"
          - strong [ref=e639]: skills
          - text: (things that worked — reusable procedures and playbooks),
          - strong [ref=e640]: failures
          - text: (things that didn’t work, with the context for why), and
          - strong [ref=e641]: facts
          - text: (task-scoped knowledge like schemas, conventions, or user preferences). Each record ships with provenance (which task produced it), confidence, and use counts.
      - generic [ref=e642]:
        - button "How is this different from a vector database?" [ref=e643]:
          - generic [ref=e644]: How is this different from a vector database?
          - img [ref=e646]
        - paragraph [ref=e647]: Vector databases store what your agent said. LearnKit distills what your agent did — the full trajectory of tool calls, reasoning steps, and outcomes — into structured, reusable knowledge. Retrieval is hybrid (semantic + task classification + procedural playbooks) rather than pure similarity search.
      - generic [ref=e648]:
        - button "Does it work with my existing agent framework?" [ref=e649]:
          - generic [ref=e650]: Does it work with my existing agent framework?
          - img [ref=e652]
        - paragraph [ref=e653]: "Yes. LearnKit is framework-agnostic. Officially tested with DSPy, LangChain, LlamaIndex, OpenAI Assistants, and plain Python. Two decorators (`@lk.agent_learn`, `@lk.learn`) integrate with any function that takes a task and returns a result."
      - generic [ref=e654]:
        - button "What LLMs are supported?" [ref=e655]:
          - generic [ref=e656]: What LLMs are supported?
          - img [ref=e658]
        - paragraph [ref=e659]: Any chat-completions-compatible model — OpenAI, Anthropic, Google, Mistral, and any self-hosted model via vLLM or sglang. Our published benchmarks use Qwen2.5-14B and 32B running on local GPUs, but the SDK is model-agnostic.
      - generic [ref=e660]:
        - button "How much does it cost to run?" [ref=e661]:
          - generic [ref=e662]: How much does it cost to run?
          - img [ref=e664]
        - paragraph [ref=e665]: The SDK is MIT-licensed and free. Storage runs on SQLite locally or Postgres in production — no proprietary infrastructure. Distillation uses ~1 additional LLM call per completed task, offset many times over by the −33% to −46% reduction in future call counts.
      - generic [ref=e666]:
        - button "Is my data ever sent to LIA Labs?" [ref=e667]:
          - generic [ref=e668]: Is my data ever sent to LIA Labs?
          - img [ref=e670]
        - paragraph [ref=e671]: Never. LearnKit runs entirely inside your infrastructure. There is no phone-home, no telemetry, no data upload. The observability dashboard is self-hosted and reads directly from your local store.
      - generic [ref=e672]:
        - button "How do I know memories are actually helping?" [ref=e673]:
          - generic [ref=e674]: How do I know memories are actually helping?
          - img [ref=e676]
        - paragraph [ref=e677]: Every dashboard view answers this. The Overview shows cold-vs-warm success rates side by side. The Benchmarks page reproduces our published numbers against your own agent. The Trace view shows exactly which memories were retrieved and applied for any given task.
      - generic [ref=e678]:
        - button "What happens to bad or outdated memories?" [ref=e679]:
          - generic [ref=e680]: What happens to bad or outdated memories?
          - img [ref=e682]
        - paragraph [ref=e683]: LearnKit tracks confidence and decay on every record. Memories that consistently fail get automatically down-weighted; memories that repeatedly succeed get reinforced. You can also quarantine or delete records manually from the Memory Lifecycle page.
      - generic [ref=e684]:
        - button "How is this different from LangChain’s memory?" [ref=e685]:
          - generic [ref=e686]: How is this different from LangChain’s memory?
          - img [ref=e688]
        - paragraph [ref=e689]: "LangChain memory is a chat-buffer abstraction — it stores conversation turns, not learned behavior. LearnKit sits at a different layer: it captures agent decisions, distills them into playbooks, and injects them back as procedural guidance. The two are complementary, not competing."
      - generic [ref=e690]:
        - button "Can I contribute or self-host the dashboard?" [ref=e691]:
          - generic [ref=e692]: Can I contribute or self-host the dashboard?
          - img [ref=e694]
        - paragraph [ref=e695]: "Yes to both. The dashboard, SDK, and benchmark harness are all in the same open-source repository. Docker images and a one-command deploy script are shipped in `/deploy`. Community contributions welcome — see CONTRIBUTING.md."
